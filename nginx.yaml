apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: weather-app
  labels: { app: nginx }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: slayder2709/weather-nginx:latest
          ports:
            - name: http
              containerPort: 80
            - name: metrics       # <-- thường bị thiếu
              containerPort: 9145
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: weather-app
spec:
  selector: { app: nginx }
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: metrics             # <-- BẮT BUỘC để scrape qua Service
    port: 9145
    targetPort: 9145