apiVersion: v1
kind: ConfigMap
metadata:
  name: email-service-config
  namespace: weather-app
data:
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_LOGIN_TOPIC: "user-login-events"
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap.monitoring.svc.cluster.local:11800"
  SW_AGENT_NAME: "weather-email-service"
  SW_AGENT_INSTANCE_NAME: "email-instance-1"
---
# Secret chứa thông tin nhạy cảm SMTP. Không commit file này lên git ở dạng plain text.
# Tạo secret bằng lệnh (khuyến nghị) thay vì để giá trị base64 tĩnh trong repo:
#   kubectl create secret generic email-service-secret \
#     --from-literal=SMTP_USER=<smtp_user> \
#     --from-literal=SMTP_PASS=<smtp_pass> \
#     -n weather-app
apiVersion: v1
kind: Secret
metadata:
  name: email-service-secret
  namespace: weather-app
type: Opaque
stringData:
  SMTP_USER: "22520059@gm.uit.edu.vn"
  SMTP_PASS: "xexy afgu elyr urgu"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: weather-app
  labels: { app: email-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: email-service }
  template:
    metadata:
      labels: { app: email-service }
    spec:
      containers:
        - name: email-service
          image: slayder2709/weather-email-service:latest
          envFrom:
            - configMapRef:
                name: email-service-config
            - secretRef:
                name: email-service-secret