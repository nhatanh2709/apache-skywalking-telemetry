# =============================================================================
# SkyWalking OAP 11.x + Horizon UI + BanyanDB  (namespace: monitoring)
#
# Thay doi so voi ban 10.4.0:
#   1. OAP image -> 11.0.0
#   2. OAP mo them admin host: 17128 (REST) + 17129 (admin-internal gRPC)
#   3. Xoa Deployment/Service "skywalking-ui" (OAP 11 khong con bundle web UI)
#   4. horizon.yaml: them oap.adminUrl -> http://skywalking-oap:17128
#   5. Horizon UI dung image release apache/skywalking-ui:horizon-0.7.0
#   6. Bo "banyandb/*" khoi OTEL metrics rules (so11y moi can BanyanDB 0.11+)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: banyandb-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banyandb
  namespace: monitoring
  labels: { app: banyandb }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: banyandb }
  template:
    metadata:
      labels: { app: banyandb }
    spec:
      containers:
        - name: banyandb
          # Doi len 0.11.x khi ban do da release, neu muon dung dashboard
          # self-observability BanyanDB moi (SWIP-15) cua OAP 11.
          image: apache/skywalking-banyandb:0.10.3
          args:
            - standalone
            - --stream-root-path=/data
            - --measure-root-path=/data
            - --metadata-root-path=/data
          ports:
            - { name: grpc,    containerPort: 17912 }   # OAP -> BanyanDB
            - { name: http,    containerPort: 17913 }   # Web UI + bydbctl
            - { name: metrics, containerPort: 2121 }    # Prometheus
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          readinessProbe:
            tcpSocket: { port: 17912 }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 17912 }
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: banyandb-data }
---
apiVersion: v1
kind: Service
metadata:
  name: banyandb
  namespace: monitoring
  labels: { app: banyandb }
spec:
  selector: { app: banyandb }
  ports:
    - { name: grpc,    port: 17912, targetPort: 17912 }
    - { name: http,    port: 17913, targetPort: 17913 }
    - { name: metrics, port: 2121,  targetPort: 2121 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skywalking-oap
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skywalking-oap-k8s-metadata
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skywalking-oap-k8s-metadata
subjects:
  - kind: ServiceAccount
    name: skywalking-oap
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: skywalking-oap-k8s-metadata
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-oap
  namespace: monitoring
  labels: { app: skywalking-oap }
spec:
  replicas: 1
  selector:
    matchLabels: { app: skywalking-oap }
  template:
    metadata:
      labels: { app: skywalking-oap }
    spec:
      serviceAccountName: skywalking-oap
      containers:
        - name: skywalking-oap
          image: apache/skywalking-oap-server:11.0.0
          ports:
            - { name: rest,            containerPort: 12800 }
            - { name: grpc,            containerPort: 11800 }
            - { name: prometheus-port, containerPort: 1234  }
            - { name: zipkin-rcv,      containerPort: 9411  }
            - { name: zipkin-qry,      containerPort: 9412  }
            # MOI trong 11.x: admin host. Horizon UI doc /status/*, /inspect/*,
            # /ui-management/templates/* qua port nay.
            - { name: admin,           containerPort: 17128 }
            # admin-internal gRPC: chi can khi chay OAP nhieu replica (cluster).
            - { name: admin-grpc,      containerPort: 17129 }
          env:
            - name: SW_STORAGE
              value: "banyandb"
            - name: SW_STORAGE_BANYANDB_TARGETS
              value: "banyandb:17912"
            - name: SW_OTEL_RECEIVER
              value: "default"
            - name: SW_OTEL_RECEIVER_ENABLED_HANDLERS
              value: "otlp-metrics,otlp-traces,otlp-logs"
            # Da bo "banyandb/*": bo rules nay trong 11.x duoc viet lai theo
            # model cluster/container/group va yeu cau BanyanDB 0.11+.
            - name: SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES
              value: "oap,istio-controlplane,vm,k8s/*,nginx/*,kafka/*,mongodb/*,aws-s3/*"
            - name: SW_RECEIVER_ZIPKIN
              value: "default"
            - name: SW_QUERY_ZIPKIN
              value: "default"
            - name: SW_TELEMETRY
              value: "prometheus"
            - name: SW_TELEMETRY_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: SW_TELEMETRY_PROMETHEUS_PORT
              value: "1234"
            # admin-server + status + inspect + ui-management default = on
            # trong 11.0.0, khong can khai bao. Neu muon tat mot module:
            #   - name: SW_DSL_DEBUGGING
            #     value: ""
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /healthcheck, port: 12800 }
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthcheck, port: 12800 }
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: skywalking-oap
  namespace: monitoring
spec:
  # Giu ClusterIP: port 17128 KHONG co authentication -> khong NodePort/Ingress.
  selector: { app: skywalking-oap }
  ports:
    - { name: rest,            port: 12800, targetPort: 12800 }
    - { name: grpc,            port: 11800, targetPort: 11800 }
    - { name: prometheus-port, port: 1234,  targetPort: 1234  }
    - { name: zipkin-rcv,      port: 9411,  targetPort: 9411  }
    - { name: zipkin-qry,      port: 9412,  targetPort: 9412  }
    - { name: admin,           port: 17128, targetPort: 17128 }
    - { name: admin-grpc,      port: 17129, targetPort: 17129 }
---
# =============================================================================
# Deployment/Service "skywalking-ui" (apache/skywalking-ui:10.4.0 = Booster UI)
# da bi XOA: OAP 11 khong con build image do (apm-webapp + booster-ui removed).
# NodePort 31389 duoc giai phong.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: horizon-state
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: horizon-secrets
  namespace: monitoring
type: Opaque
stringData:
  HORIZON_ADMIN_HASH: "$argon2id$v=19$m=65536,t=3,p=4$qqofyq+LpF9YzFBaycm6Lg$Bfa0tHCwJCOMP5sX6IGyUArXb9YaelH9wEjQtgh1IOY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: horizon-config
  namespace: monitoring
data:
  horizon.yaml: |
    server:
      host: 0.0.0.0
      port: 8081
    oap:
      queryUrl: http://skywalking-oap:12800          # GraphQL / MQE / query
      adminUrl: http://skywalking-oap:17128          # MOI: admin host cua OAP 11
      zipkinUrl: http://skywalking-oap:9412/zipkin   # chi can neu dung Zipkin
    auth:
      backend: local
      local:
        users:
          # Lay hash tu Secret thay vi hardcode trong ConfigMap.
          - username: admin
            passwordHash: "${HORIZON_ADMIN_HASH}"
            roles: [admin]

    rbac:
      enabled: true

    session:
      cookieSecure: false     # dat true khi chay sau TLS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-ui
  namespace: monitoring
  labels: { app: horizon-ui }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: horizon-ui }
  template:
    metadata:
      labels: { app: horizon-ui }
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: horizon
          # Image release (Docker Hub), khong dung ghcr per-commit dev image.
          image: apache/skywalking-ui:horizon-0.7.0
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef: { name: horizon-secrets }
          volumeMounts:
            - name: config
              mountPath: /app/horizon.yaml
              subPath: horizon.yaml
              readOnly: true
            - name: state
              mountPath: /data
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: horizon-config
            items: [{ key: horizon.yaml, path: horizon.yaml }]
        - name: state
          persistentVolumeClaim: { claimName: horizon-state }
---
apiVersion: v1
kind: Service
metadata:
  name: horizon-ui
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: horizon-ui }
  ports:
    - { name: http, port: 8081, targetPort: 8081, nodePort: 31390 }