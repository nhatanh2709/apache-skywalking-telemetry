# ---------------- Zookeeper ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: weather-app
  labels: { app: zookeeper }
spec:
  replicas: 1
  strategy:
    type: Recreate          # <-- chặn 2 pod ZK cùng tồn tại
  selector:
    matchLabels: { app: zookeeper }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - { containerPort: 2181, name: client }
          env:
            - { name: ZOOKEEPER_CLIENT_PORT,          value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME,            value: "2000" }
            - { name: ZOOKEEPER_MAX_CLIENT_CNXNS,     value: "100" }
            - { name: ZOOKEEPER_ADMIN_ENABLE_SERVER,  value: "false" }
            - { name: ZOOKEEPER_4LW_COMMANDS_WHITELIST, value: "srvr,ruok,stat,mntr" }
            - { name: KAFKA_HEAP_OPTS,                value: "-Xms256M -Xmx512M" }
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { memory: "1Gi" }
          readinessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - { name: zk-data, mountPath: /var/lib/zookeeper/data }
            - { name: zk-log,  mountPath: /var/lib/zookeeper/log }
      volumes:
        # Dev/test: emptyDir. Production: đổi sang PersistentVolumeClaim.
        - { name: zk-data, emptyDir: {} }
        - { name: zk-log,  emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: weather-app
spec:
  selector: { app: zookeeper }
  ports:
    - { name: client, port: 2181, targetPort: 2181 }
---
# ---------------- Kafka ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: weather-app
  labels: { app: kafka }
spec:
  replicas: 1
  strategy:
    type: Recreate          # <-- broker.id trùng nếu 2 pod cùng chạy
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-zk
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z zookeeper 2181; do
                echo "waiting for zookeeper..."; sleep 3;
              done
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - { containerPort: 9092,  name: external }
            - { containerPort: 29092, name: internal }
          env:
            - { name: KAFKA_BROKER_ID,       value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181" }
            - { name: KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS, value: "30000" }
            - { name: KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS,    value: "30000" }
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.weather-app.svc.cluster.local:9092,PLAINTEXT_INTERNAL://kafka.weather-app.svc.cluster.local:29092"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092"
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT_INTERNAL" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512M -Xmx1G" }
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { memory: "2Gi" }
          readinessProbe:
            tcpSocket: { port: 29092 }
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - { name: kafka-data, mountPath: /var/lib/kafka/data }
      volumes:
        - { name: kafka-data, emptyDir: {} }